<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" width="100%" height="420">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="term-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="60%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="ascii-neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <style>
      .term-window {
        fill: url(#term-bg);
        stroke: #30363d;
        stroke-width: 1.2;
        rx: 12px;
      }
      .term-title {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #8b949e;
        font-weight: 500;
      }
      .cmd-prompt {
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 11px;
        fill: #94a3b8;
      }
      .ascii-line {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 9.5px;
        letter-spacing: 1.2px;
        fill: url(#ascii-neon);
        opacity: 0;
        transform: translateY(3px);
      }
      .cursor-block {
        fill: #38bdf8;
      }

      /* Staggered Row Reveal Animation */
      @keyframes revealRow {
        0% {
          opacity: 0;
          transform: translateY(3px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Typewriter prompt at bottom */
      @keyframes fadeInFooter {
        0% { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* Sweeping / Blinking Terminal Cursor */
      @keyframes blinkCursor {
        0%, 45% { opacity: 1; }
        50%, 95% { opacity: 0; }
        100% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Window Container -->
  <rect width="440" height="420" class="term-window" />

  <!-- macOS Window Control Buttons -->
  <circle cx="22" cy="19" r="5.5" fill="#ef4444" />
  <circle cx="38" cy="19" r="5.5" fill="#f59e0b" />
  <circle cx="54" cy="19" r="5.5" fill="#10b981" />

  <!-- Window Title -->
  <text x="220" y="23" text-anchor="middle" class="term-title">sonu@avatar: ~ (ascii-portrait)</text>

  <!-- Divider Line -->
  <line x1="0" y1="36" x2="440" y2="36" stroke="#21262d" stroke-width="1" />

  <!-- Terminal Command Execution -->
  <g transform="translate(20, 56)">
    <text class="cmd-prompt">
      <tspan fill="#38bdf8">sonu@devbox</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a855f7">~</tspan><tspan fill="#f1f5f9">$ cat avatar.ascii</tspan>
    </text>
  </g>

  <!-- ASCII Art Rows (Revealed Top to Bottom) -->
  <g transform="translate(20, 72)">
    <text x="0" y="11.8" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;">@@@@@@@@@@@@@@@@@@@@@@@@@@@@%%#++*#%@@@%%%</text>
    <text x="0" y="23.6" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.255s forwards;">@@@@@@@@@@@@@@@@@@@@@@@@@@@@%%%*+##%%%%%%%</text>
    <text x="0" y="35.4" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.31s forwards;">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%%%####%%%%%%</text>
    <text x="0" y="47.2" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.365s forwards;">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%%%%%##%%%%%%</text>
    <text x="0" y="59.0" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.42s forwards;">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%%%%%%%%%####</text>
    <text x="0" y="70.8" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.475s forwards;">@@@@@@@@@@@@@@@@@@@@@@@@@@@@@@%%%%%%%#####</text>
    <text x="0" y="82.6" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.53s forwards;">@@@@@@@@@@@@@@@%%%%@@@@@@@@%%%%%%%########</text>
    <text x="0" y="94.4" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.585s forwards;">@@@@%%%%@%%%%%%%%%%%%@@%%%%%%%%###########</text>
    <text x="0" y="106.2" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.64s forwards;">%%%%############%%%%%%%%%%################</text>
    <text x="0" y="118.0" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.695s forwards;">#######*################%#############****</text>
    <text x="0" y="129.8" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.75s forwards;">***************########=.-##**************</text>
    <text x="0" y="141.6" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.805s forwards;">**********++**********+-..:=***********+++</text>
    <text x="0" y="153.4" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.86s forwards;">++++++++++++++++++++++---:.-++*++++++++===</text>
    <text x="0" y="165.2" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.915s forwards;">:...::::...::---:::::-. .:----===+++=-----</text>
    <text x="0" y="177.0" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 0.97s forwards;">                     :  ..::. .::---::::::</text>
    <text x="0" y="188.8" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 1.025s forwards;">                       ...:.    ...    .  </text>
    <text x="0" y="200.6" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 1.08s forwards;">                         ..               </text>
    <text x="0" y="212.4" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 1.135s forwards;">                                          </text>
    <text x="0" y="224.2" class="ascii-line" style="animation: revealRow 0.22s cubic-bezier(0.16, 1, 0.3, 1) 1.19s forwards;">                                          </text>
  </g>

  <!-- Footer Typewriter Section ($ whoami -> Sonu Sharma) -->
  <g transform="translate(20, 335)">
    <!-- Command Prompt -->
    <text class="cmd-prompt" style="opacity: 0; animation: fadeInFooter 0.3s ease-out 1.61s forwards;">
      <tspan fill="#38bdf8">sonu@devbox</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a855f7">~</tspan><tspan fill="#f1f5f9">$ whoami</tspan>
    </text>

    <!-- Response Output -->
    <g transform="translate(0, 22)" style="opacity: 0; animation: fadeInFooter 0.35s ease-out 1.91s forwards;">
      <text font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#22c55e">
        ➜ Sonu Sharma <tspan fill="#38bdf8" font-size="11" font-weight="500">[Frontend Engineer &amp; UI/UX]</tspan>
      </text>
    </g>

    <g transform="translate(0, 42)" style="opacity: 0; animation: fadeInFooter 0.35s ease-out 2.06s forwards;">
      <text font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#94a3b8">
        ⚡ Obsessed with 60fps micro-interactions &amp; testability.
      </text>
      <!-- Blinking Cursor Block -->
      <rect x="355" y="-10" width="7" height="13" class="cursor-block" style="animation: blinkCursor 0.9s step-end infinite; animation-delay: 2.01s;" />
    </g>
  </g>
</svg>